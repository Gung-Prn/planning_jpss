name: Sync current JPSS OMM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/sync_jpss_current_omm.py"
      - ".github/workflows/sync-jpss-current-omm.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-current-jpss-omm
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependency
        run: python3 -m pip install "requests==2.32.3"

      - name: Fetch and validate current OMM
        run: python3 scripts/sync_jpss_current_omm.py

      - name: Publish changed OMM snapshot
        run: |
          if git diff --quiet -- satellite_data; then
            echo "JPSS OMM snapshot is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellite_data
          git commit -m "Sync current JPSS OMM"
          git pull --rebase origin main
          git push
